name: Post to X

on:
  push:
    branches:
      - main
      - master

# Only one post run at a time; don't cancel an in-flight post.
concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Post latest commit to X via Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TWITTER_ACCOUNT_ID: ${{ secrets.ZERNIO_TWITTER_ACCOUNT_ID }}
          # Passed via env (not inline templating) to avoid shell injection.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail

          if [ -z "${ZERNIO_TWITTER_ACCOUNT_ID:-}" ]; then
            echo "::warning::ZERNIO_TWITTER_ACCOUNT_ID secret is not set — skipping the X post."
            echo "Set it with: gh secret set ZERNIO_TWITTER_ACCOUNT_ID --repo \$GITHUB_REPOSITORY"
            exit 0
          fi

          # Use just the commit subject (first line) and keep within X's 280-char limit.
          SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | cut -c1-200)"
          CONTENT="${SUBJECT}"$'\n\n'"${COMMIT_URL}"

          PAYLOAD="$(jq -n \
            --arg content "$CONTENT" \
            --arg accountId "$ZERNIO_TWITTER_ACCOUNT_ID" \
            '{content: $content, platforms: [{platform: "twitter", accountId: $accountId}], publishNow: true}')"

          HTTP_CODE="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://api.zernio.com/v1/posts \
            -H "Authorization: Bearer ${ZERNIO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")"

          echo "Zernio response (HTTP $HTTP_CODE):"
          cat response.json || true
          echo

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Posted to X successfully."
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "::warning::Zernio reported duplicate content within 24h (409) — nothing posted, treating as non-fatal."
          else
            echo "::error::Zernio API returned HTTP $HTTP_CODE"
            exit 1
          fi
