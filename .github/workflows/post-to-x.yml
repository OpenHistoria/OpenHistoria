name: Post to X

on:
  push:
    branches:
      - master

# Only one post run at a time; don't cancel an in-flight post.
concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post latest commit to X via Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TWITTER_ACCOUNT_ID: ${{ secrets.ZERNIO_TWITTER_ACCOUNT_ID }}
          # Passed via env (not inline templating) to avoid shell injection.
          # Convention: put a Tweet: block in the commit body to publish a post.
          # If absent, this workflow skips posting.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: .github/scripts/post-to-x.sh
